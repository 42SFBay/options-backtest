# Default configuration for iron condor backtesting
# Based on Dili's current strategy

strategy:
  type: iron_condor
  
  # Core parameters
  delta: 0.15
  wing_width: 20
  dte: 2
  
  # Entry rules
  entry_time: "10:15"  # ET (7:15 AM PDT)
  
  # Exit rules (optional - comment out for hold-to-expiry)
  # profit_target_pct: 0.50  # Exit at 50% of max profit
  # stop_loss_pct: 2.0       # Exit at 2x credit loss

data:
  symbol: SPX
  # start_date: "2024-01-01"  # Optional, defaults to 90 days ago
  # end_date: "2024-12-31"    # Optional, defaults to today

filters:
  # VIX filters (optional)
  # min_vix: 12
  # max_vix: 30
  
  # Day of week filters (optional)
  # skip_days:
  #   - Monday
  #   - Friday

position_sizing:
  max_risk_per_trade: 3000  # Max loss per trade
  contracts: 1

# Hypotheses to test (run with --sweep flag)
sweep:
  deltas: [0.10, 0.12, 0.15, 0.18, 0.20]
  wing_widths: [15, 20, 25, 30]
  dtes: [0, 1, 2, 3]
